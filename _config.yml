# ----
# Site

title: Precision Piano
url: "https://www.precisionpianomaine.com"
baseurl:

google_analytics_key:
disqus_shortname:

# Values for the jekyll-seo-tag gem
logo: /siteicon.png
description: Professional piano tuning, repair, regulation, voicing, restoration and moving throughout Midcoast and Downeast Maine.

author:
  name: Frank Fischer
  email:
  twitter:

social:
  name: Precision Piano
  links:
    - https://www.facebook.com/profile.php?id=61593185802673
    - https://www.instagram.com/precisionpianomaine/
    
# -----
# Build

timezone: Etc/UTC

permalink: pretty

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-paginate
  - jekyll-archives

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENCE

collections:
  staff_members:
    _hide_content: true
    _icon: account_circle

paginate: 10
paginate_path: "/blog/:num/"

jekyll-archives:
  enabled: ['categories']

defaults:
  -
    scope:
      path: ""
      type: "staff_members"
    values:
      _options:
        image_path:
          width: 440
          height: 440
          uploads_dir: "/images/staff_members"

  -
    scope:
      path: ""
    values:
      layout: "default"

  -
    scope:
      type: "posts"
    values:
      layout: "post"
      _options:
        image:
          width: 2000
          height: 1322
          resize_style: cover
          uploads_dir: "/images/post_uploads"
        content:
          width: 1500
          height: 2000
          uploads_dir: "/images/post_uploads"

  -
    scope:
      path: "contact-success.html"
    values:
      layout: "page"

  -
    scope:
      path: ""
      type: "pages"
    values:
      image:
        width: 2000
        height: 1322
        resize_style: cover
      bottom_image:
        width: 2000
        height: 1322
        resize_style: cover

# -----------
# CloudCannon

social_icons:
  - Facebook
  - Google Plus
  - Instagram
  - LinkedIn
  - Pinterest
  - Tumblr
  - Twitter
  - YouTube
  - Email
  - RSS

_comments:
  description: Text shown when sharing on social media
  blurb: Short bio or description of this person
