<section class="pad">
	<div class="text-container contact-box">

		<div class="primary-contact">
			<h2>Call or Text Us</h2>

			<p class="phone-label">
				The fastest way to reach Precision Piano is by phone.
			</p>

			<a class="phone-number" href="tel:+14234431678">
				423-443-1678
			</a>

			<p class="phone-note">
				Call or text to ask a question, schedule a service, or
				discuss your piano's needs.
			</p>
		</div>

		<div class="contact-divider">
			<span>or send us a message</span>
		</div>

		<form action="https://formspree.io/f/xaeyvnrq" method="post" class="contact-form">

			<label for="name">Name</label>
			<input
				type="text"
				name="name"
				id="name"
				placeholder="Enter your name..."
				required
			>

			<label for="email">Email Address</label>
			<input
				type="email"
				name="email"
				id="email"
				placeholder="Enter your email..."
				required
			>

			<label for="phone">Phone</label>
			<input
				type="tel"
				name="phone"
				id="phone"
				placeholder="Enter your phone number..."
			>

			<label for="service">Service Needed</label>
			<select name="service" id="service">
				<option value="">Select a service...</option>
				<option value="Piano tuning">Piano tuning</option>
				<option value="Regulation / voicing">Regulation / voicing</option>
				<option value="Piano repair">Piano repair</option>
				<option value="Piano evaluation">Piano evaluation</option>
				<option value="Rebuilding / restoration">Rebuilding / restoration</option>
				<option value="Piano moving">Piano moving</option>
				<option value="Not sure">I'm not sure</option>
			</select>

			<label for="message">Message</label>
			<textarea
				name="message"
				id="message"
				placeholder="Tell us about your piano or service needs..."
				required
			></textarea>

			<input
				type="hidden"
				name="_subject"
				value="New Precision Piano website inquiry"
			>

			<input
				type="text"
				name="_gotcha"
				style="display:none;"
			>

			<input type="submit" value="Send Message">

		</form>

		<div class="contact-details">

			<h3>Email</h3>

			<p>
				<a href="mailto:borchardwill@gmail.com">
					borchardwill@gmail.com
				</a>
			</p>

		</div>

	</div>
</section>
