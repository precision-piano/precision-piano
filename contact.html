---
title: Contact
description: Get in touch to schedule a tuning, repair or piano move.
image: /images/NBSS-2026-057.jpg

---

<section class="hero" style="background-image: url({% include relative-src.html src=page.image %})">
	<div class="inner-hero text-container">
		<div class="hero-text-container">
			<h1 class="editable">Schedule Your Piano Service</h1>
			<p class="subtext editable">Questions about tuning, repair or moving? Send us a message and we'll get back to you as soon as we can.</p>
		</div>
	</div>
</section>

<section class="pad">
	<div class="text-container contact-box">
		<form action="https://formspree.io/f/xaeyvnrq" method="POST">

  <div class="form-group">
    <label for="name">Name <span aria-hidden="true">*</span></label>
    <input
      type="text"
      id="name"
      name="name"
      autocomplete="name"
      required
    >
  </div>

  <div class="form-group">
    <label for="email">Email <span aria-hidden="true">*</span></label>
    <input
      type="email"
      id="email"
      name="email"
      autocomplete="email"
      required
    >
  </div>

  <div class="form-group">
    <label for="phone">Phone <span aria-hidden="true">*</label>
    <input
      type="tel"
      id="phone"
      name="phone"
      autocomplete="tel"
	  required
    >
  </div>

	<div class="form-group">
    <label for="address">Address <span aria-hidden="true">*</label>
    <input
      type="where"
      id="address"
      name="address"
      autocomplete="where"
	  required
    >
  </div>

			
  <div class="form-group">
    <label for="service">What can we help you with?</label>
    <select id="service" name="service">
      <option value="">Please select a service</option>
      <option value="Piano tuning">Piano tuning</option>
      <option value="Piano repair">Piano repair</option>
      <option value="Regulation / voicing">Regulation / voicing</option>
      <option value="Piano evaluation">Piano evaluation</option>
      <option value="Rebuilding / restoration">Rebuilding / restoration</option>
      <option value="Piano moving">Piano moving</option>
      <option value="Not sure">I'm not sure</option>
    </select>
  </div>

  <div class="form-group">
    <label for="message">Message <span aria-hidden="true">*</span></label>
    <textarea
      id="message"
      name="message"
      rows="7"
      placeholder="Tell us about your piano and how we can help."
      required
    ></textarea>
  </div>

  <!-- Email subject -->
  <input
    type="hidden"
    name="_subject"
    value="New Precision Piano Website Inquiry"
  >

  <!-- Spam protection -->
  <div style="position:absolute; left:-9999px;" aria-hidden="true">
    <label for="website">Leave this field blank</label>
    <input
      type="text"
      id="website"
      name="_gotcha"
      tabindex="-1"
      autocomplete="off"
    >
  </div>

  <button type="submit">Send Message</button>

</form>

		<div class="contact-details">
			<h3>Phone</h3>
			<p class="editable"><a href="tel:+14234431678">423-443-1678</a></p>

		</div>
	</div>
</section>

<div class="map" id="map"></div>

<link
	rel="stylesheet"
	href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
	document.addEventListener("DOMContentLoaded", function () {

		// Create the map
		var map = L.map("map", {
			scrollWheelZoom: false,
			dragging: false,
			doubleClickZoom: false,
			boxZoom: false,
			keyboard: false,
			zoomControl: false
		}).setView([44.48, -68.72], 9);

		// Clean OpenStreetMap base layer
		L.tileLayer(
			"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
			{
				maxZoom: 18,
				attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
			}
		).addTo(map);

		/*
		 * PRECISION PIANO SERVICE AREA
		 *
		 * Approximate area includes:
		 *
		 * Rockland
		 * South Thomaston
		 * Thomaston
		 * Owl's Head
		 * Camden
		 * Union
		 * Searsport / Searsport area
		 * Sears­mont
		 * Belfast
		 * Monroe
		 * Bangor
		 * Blue Hill
		 * Ellsworth
		 * Bar Harbor
		 * Vinalhaven
		 * and surrounding coastal/island communities
		 */

		var serviceArea = [

			// SOUTHWESTERN EDGE
			[44.0657, -69.1089], // Rockland
			[44.0500, -69.1000], // South Thomaston
			[44.0750, -69.1500], // Thomaston / Owl's Head area

			// MIDCOAST / CAMDEN
			[44.1200, -69.0900],
			[44.1500, -69.0750],
			[44.2098, -69.0648], // Camden
			[44.2500, -69.0450],

			// UNION / SEARSMONT
			[44.2300, -69.2500], // Union area
			[44.3000, -69.3000],
			[44.3500, -69.2000], // Searsmont area

			// BELFAST / MONROE
			[44.4289, -68.9947], // Belfast
			[44.4800, -69.0500],
			[44.5600, -69.0500], // Monroe area

			// NORTHERN EDGE / BANGOR
			[44.6500, -68.9500],
			[44.8012, -68.7778], // Bangor
			[44.8500, -68.6500],

			// EASTERN PENINSULA
			[44.9000, -68.5500],
			[44.8500, -68.4000],
			[44.7500, -68.3500],

			// ELLSWORTH
			[44.5434, -68.4195], // Ellsworth
			[44.5000, -68.4300],

			// BLUE HILL
			[44.4139, -68.5867], // Blue Hill
			[44.3500, -68.6000],

			// TOWARD MOUNT DESERT / BAR HARBOR
			[44.4000, -68.5000],
			[44.4200, -68.3500],
			[44.4300, -68.2500],
			[44.3900, -68.2000],
			[44.3300, -68.2500],

			// SOUTHERN COAST / ISLAND REGION
			[44.2800, -68.3500],
			[44.2200, -68.4500],
			[44.2000, -68.5500],
			[44.1800, -68.6500],
			[44.1500, -68.7500],

			// VINALHAVEN / ISLAND COVERAGE
			[44.0500, -68.8500],
			[44.0200, -68.9000],
			[44.0500, -69.0000],

			// BACK TO ROCKLAND
			[44.0657, -69.1089]
		];

		// Draw the service area
		L.polygon(serviceArea, {
			color: "#315f67",
			weight: 2,
			opacity: 0.8,
			fillColor: "#6faaa5",
			fillOpacity: 0.22,
			lineJoin: "round"
		}).addTo(map);

		// Attribution
		L.control.attribution({
			position: "bottomright",
			prefix: false
		}).addTo(map);

	});
</script>

<style>
	#map {
		width: 100%;
		height: 450px;
		min-height: 350px;
		border-radius: 6px;
		overflow: hidden;
		box-shadow: 0 3px 14px rgba(0, 0, 0, 0.10);
	}

	#map .leaflet-control-attribution {
		background: rgba(255, 255, 255, 0.75);
		font-size: 9px;
		padding: 2px 5px;
	}
</style>
